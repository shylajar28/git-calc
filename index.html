<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output class="result" id="result" aria-live="polite">0</output>
    </div>

    <div class="keys">
      <button class="key key-clear span-2" data-action="clear">AC</button>
      <button class="key key-clear span-2" data-action="delete" aria-label="Delete last digit">⌫</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key-op" data-operator="/" aria-label="Divide">÷</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key key-op" data-operator="-" aria-label="Subtract">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key key-op" data-operator="+" aria-label="Add">+</button>

      <button class="key span-2" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key-equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
